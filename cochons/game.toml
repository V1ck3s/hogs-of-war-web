[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# Taken over by game mods (same addresses as Frontschweine, below the FR/DE
# code shift): CD file library Open/ReadAt/Load (Instant Loading), libetc
# v_wait and StGetNext (CPU overclock busy-waits), GetVideoMode (60 Hz).
