                            "0x800238A0", "0x8001E30C"]

[runtime]
window_title = "Cochons de Guerre"
memcard_dir = "saves"
overlay_cache = true
# From the Frontschweine (DE) project: the game loads code at runtime into its
# own boot EXE text (FMV player, battle modules over 0x80030000..0x8005B000).
# Treating text from 0x18000 up as overlay region lets compiled shards own it
# instead of the dirty-RAM interpreter. Same layout in the French EXE below
# 0x80046000 (seed lists identical up to there).
overlay_region_floor = "0x18000"

# Hottest interpreted entry PCs measured in a French multiplayer battle
# (dirty_ram_stats, insns > 200k). Same mechanism as Frontschweine's list:
# no load_addr/bytes_crc; byte guards select the matching shard at runtime.
[[overlays]]
entries = ["0x80040FE4", "0x80046E70", "0x80047A9C", "0x80047DB8", "0x80047F9C", "0x8004B3D4", "0x8004C1AC", "0x8004ED38", "0x8004F058", "0x80051490", "0x8005C494", "0x8005C4DC", "0x8005D000", "0x8005E260", "0x8006350C", "0x80063DFC", "0x80065EF4", "0x80071464", "0x800719A4", "0x80085830", "0x80085838", "0x80085C00", "0x80085C28", "0x8009DC80", "0x800AA3B0", "0x800CE6DC", "0x800CF714", "0x800E33F4", "0x800E3408"]

# Widescreen tuning from Frontschweine (addresses below the FR/DE shift point,
# identical in both releases). adaptive_view lets the streaming server set any
# aspect from 4:3 to 21:9 by resizing the game window.
[widescreen]
native_wide = false
gameplay_state_addr = "0x8002AA50"
gameplay_state_values = ["0x80042768"]
gte_game_mode = true
hud_sprt_squash = true
auto_ui_squash = true
hud43_rank_band = 25
hud43_keep = [
  { op = "0x64", height = 11 },
  { op = "0x2C", width = 43, height = 22 },
]
adaptive_view = true
offer_ultrawide = true

[video]
renderer = "opengl"
aspect_ratio = "16:9"

[controller]
